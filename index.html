<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Art Studio</title>

    <style>

        @import url('https://onlinewebfonts.com');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Georgia, serif;
            background: #000000;
            color: #ffffff;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            border-bottom: 1px solid #ddd6ce;
            background: rgba(145, 190, 150, 0.35);
            backdrop-filter: blur(5px);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }


        .green-divider {
            height: 15px;
            background: #051711;
            position: absolute;
            top: 65px;
            left: 0;
            width: 100%;
            z-index: 99;
        }


        .studio-logo {
            width: 110px;
            height: auto;
            display: block;
            position: absolute;
            top: 10px;
            left: 7%;
            z-index: 101;

            filter:
                brightness(0)
                saturate(100%)
                invert(91%)
                sepia(25%)
                saturate(750%)
                hue-rotate(5deg)
                brightness(110%)
                contrast(90%);
        }


        .desktop-menu {
            display: flex;
            gap: 30px;
            margin-left: auto;
        }


        .desktop-menu a {
            color: #79bb99;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: bold;
            transition: color 0.3s;
        }


        .desktop-menu a:hover {
            color: #ffffff;
        }


        /* =========================
           MOBILE MENU
        ========================= */

        .menu-container {
            display: none;
            position: relative;
        }


        .menu-button {
            background: none;
            border: none;
            color: #70ad6b;
            font-size: 30px;
            cursor: pointer;
        }


        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 50px;
            background: #111111;
            min-width: 180px;
            padding: 15px 0;
            border: 1px solid #333333;
            z-index: 200;
        }


        .dropdown-menu.open {
            display: block;
        }


        .dropdown-menu a {
            display: block;
            color: #79bb99;
            text-decoration: none;
            padding: 14px 25px;
            font-size: 13px;
            letter-spacing: 2px;
        }


        .dropdown-menu a:hover {
            background: #091e16;
        }


        /* =========================
           HOME
        ========================= */

        .hero {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            text-align: center;
            padding: 95px 0 0 0;
            overflow: hidden;
            background: rgba(11, 65, 16, 0.406);
        }


        /*
           FOTOJA QËNDRON ME RAPORTIN E SAJ.
           Nuk përdorim object-fit: cover në desktop.
           Kështu fotografia nuk pritet.
        */

        .hero-bg {
            position: relative;
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
            z-index: 1;

            animation:
                panAnimation1
                4.5s
                ease-out
                forwards;
        }


        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2;
            pointer-events: none;
        }


        /*
           SHKRIMI QËNDRON MBI FOTOGRAFI.
           Ky nuk ndryshon gjatë slideshow.
        */

        .hero-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            max-width: 800px;
            width: 90%;
        }


        .hero h1 {
            font-size: 70px;
            font-weight: normal;
            line-height: 1.05;
            margin-bottom: 25px;
            color: #9dceff;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.8);

            opacity: 0;
            transform: translateY(20px);

            animation:
                textAppear
                1.4s
                ease-out
                2.2s
                forwards;
        }


        .hero p {
            color: #9dceff;
            font-size: 18px;
            margin-bottom: 35px;
            text-shadow: 1px 1px 6px rgba(0, 0, 0, 0.9);

            opacity: 0;
            transform: translateY(20px);

            animation:
                textAppear
                1.2s
                ease-out
                2.8s
                forwards;
        }


        .hero .button {
            opacity: 0;
            transform: translateY(20px);

            animation:
                textAppear
                1.2s
                ease-out
                3.3s
                forwards;
        }


        /* =========================
           FOTO ANIMATION
        ========================= */

        @keyframes panAnimation1 {

            0% {
                transform: scale(1.05);
                transform-origin: top center;
                opacity: 0.4;
            }

            100% {
                transform: scale(1);
                transform-origin: top center;
                opacity: 1;
            }
        }


        /* =========================
           TEXT ANIMATION
        ========================= */

        @keyframes textAppear {

            0% {
                opacity: 0;
                transform: translateY(20px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================
           BUTTON
        ========================= */

        .button {
            display: inline-block;
            padding: 15px 32px;
            border: 1px solid #ffffff;
            text-decoration: none;
            color: #ffffff;
            letter-spacing: 2px;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }


        .button:hover {
            background: #ffffff;
            color: #000000;
        }


        /* =========================
           FOOTER
        ========================= */

        .studio-footer {
            width: 100%;
            height: 180px;
            background: #051711;
            display: flex;
            align-items: center;
            justify-content: center;
        }


        .studio-name {
            font-family: "Amsterdam Four_ttf", cursive;
            font-size: 55px;
            color: #ffffff;
            letter-spacing: 2px;
        }


        /* =========================
           TELEFON (KODI I NDYSHUAR)
        ========================= */

        @media (max-width: 850px) {

            header {
                height: 55px;
                justify-content: flex-end;
                padding: 0 5%;
            }


            .green-divider {
                top: 55px;
            }

            .desktop-menu {
                display: none;
            }


            .menu-container {
                display: block;
                position: absolute;
                right: 20px;
            }


            /* 
               RREGULLIMI: Në celular përdorim ekran të plotë (100vh)
               dhe e qendrojmë përmbajtjen në mes si te shembulli.
            */
            .hero {
                width: 100%;
                height: 100vh;
                padding-top: 55px;
                overflow: hidden;
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #000000;
            }


            /* 
               KORNIZA SHTRIHET NË ÇDO KËND.
               Përdorim object-fit: cover që të mbushë sfondin pa hapësira të zeza.
            */
            .hero-bg { 
                position: absolute;
                top: 0;
                left: 0;
                width: 100% !important;
                height: 100% !important;
                object-fit: cover !important;
                object-position: center;
                z-index: 1;
            }   

            .hero-overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.45);
                z-index: 2;
            }

            .hero-content {
                position: relative;
                top: unset;
                left: unset;
                transform: unset;
                z-index: 3;
                width: 85%;
                text-align: center;
            }


            .hero h1 {
                font-size: 34px;
                line-height: 1.2;
                margin-bottom: 15px;
            }



.hero p {
font-size: 14px;

const menuButton =
document.getElementById('menuButton');
const dropdownMenu =
document.getElementById('dropdownMenu');
/* =========================
MOBILE MENU
========================= */
menuButton.addEventListener(
'click',
function() {
dropdownMenu.classList.toggle('open');
}
);
/* =========================
HOME LINKS
========================= */
const homeLinks =
document.querySelectorAll(
'a[href="#home"]'
);
const heroBg =
document.querySelector('.hero-bg');
/* =========================
SLIDESHOW
========================= */
if (heroBg) {
const slideshowImages = [
'images/kornix.jpeg',
'images/(1).png'
];
let currentSlide = 0;
setTimeout(function() {
/*
Çdo 5.5 sekonda
ndërrohet fotografia.
*/
setInterval(function() {
/*
Ndalojmë animacionin
e fotografisë aktuale.
*/
heroBg.style.animation = 'none';
/*
Rifreskojmë animacionin
pa prekur shkrimin.
*/
void heroBg.offsetWidth;
/*
Ndryshojmë vetëm fotografinë.
*/
heroBg.src =
slideshowImages[currentSlide];
/*
E njëjta animacion si hyrja.
*/
heroBg.style.animation =
'panAnimation1 4.5s ease-out forwards';
/*
Kalojmë te fotografia tjetër.
*/
currentSlide++;
/*
Kur arrijmë në fund,
kthehemi te fotografia e parë.
*/
if (
currentSlide >=
slideshowImages.length
) {
currentSlide = 0;
}
}, 5500);
}, 4700);
}
/* =========================
HOME CLICK
========================= */
homeLinks.forEach(function(link) {
link.addEventListener(
'click',
function() {
dropdownMenu.classList.remove(
'open'
);
/*
Kur shtypet HOME,
fotografia fillon përsëri
animacionin e saj.
*/
if (heroBg) {
heroBg.style.animation =
'none';
void heroBg.offsetWidth;
heroBg.style.animation =
'panAnimation1 4.5s ease-out forwards';
}
/*
SHKRIMI RIFILLON VETËM
KUR KLIKOJMË HOME.
Gjatë slideshow-it nuk
preket fare.
*/
const heading =
document.querySelector(
'.hero h1'
);
const paragraph =
document.querySelector(
'.hero p'
);
const button =
document.querySelector(
'.hero .button'
);
if (
heading &&
paragraph &&
button
) {
heading.style.animation =
'none';
paragraph.style.animation =
'none';
button.style.animation =
'none';
void heading.offsetWidth;
void paragraph.offsetWidth;
void button.offsetWidth;
heading.style.animation =
'textAppear 1.4s ease-out 2.2s forwards';
paragraph.style.animation =
'textAppear 1.2s ease-out 2.8s forwards';
button.style.animation =
'textAppear 1.2s ease-out 3.3s forwards';
}
}
);
});
