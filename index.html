<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Art Studio</title>


    <style>

        @import url('https://db.onlinewebfonts.com/c/07cb29fdcb073fff840edc6de2067b50?family=Amsterdam+Four_ttf');


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            width: 100%;
            min-height: 100%;
            scroll-behavior: smooth;
        }


        body {
            width: 100%;
            min-height: 100vh;
            font-family: Georgia, serif;
            background: #000000;
            color: #ffffff;
            overflow-x: hidden;
        }



        /* =========================
           HEADER
        ========================= */

        header {

            height: 65px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 7%;

            border-bottom: 1px solid #ddd6ce;

            background: rgba(145, 190, 150, 0.35);

            backdrop-filter: blur(5px);

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            z-index: 1000;
        }



        /* =========================
           GREEN DIVIDER
        ========================= */

        .green-divider {

            height: 15px;

            background: #051711;

            position: fixed;

            top: 65px;

            left: 0;

            width: 100%;

            z-index: 999;
        }



        /* =========================
           LOGO
        ========================= */

        .studio-logo {

            width: 110px;

            height: auto;

            display: block;

            position: absolute;

            top: 10px;

            left: 7%;

            z-index: 1001;

            filter:
                brightness(0)
                saturate(100%)
                invert(91%)
                sepia(25%)
                saturate(750%)
                hue-rotate(5deg)
                brightness(110%)
                contrast(90%);
        }



        /* =========================
           DESKTOP MENU
        ========================= */

        .desktop-menu {

            display: flex;

            gap: 30px;

            margin-left: auto;
        }


        .desktop-menu a {

            color: #79bb99;

            text-decoration: none;

            font-size: 13px;

            letter-spacing: 2px;

            font-weight: bold;

            transition: color 0.3s ease;
        }


        .desktop-menu a:hover {

            color: #ffffff;
        }



        /* =========================
           MOBILE MENU
        ========================= */

        .menu-container {

            display: none;

            position: relative;
        }


        .menu-button {

            background: none;

            border: none;

            color: #70ad6b;

            font-size: 30px;

            cursor: pointer;

            line-height: 1;
        }


        .dropdown-menu {

            display: none;

            position: absolute;

            right: 0;

            top: 50px;

            background: #111111;

            min-width: 180px;

            padding: 15px 0;

            border: 1px solid #333333;

            z-index: 2000;
        }


        .dropdown-menu.open {

            display: block;
        }


        .dropdown-menu a {

            display: block;

            color: #79bb99;

            text-decoration: none;

            padding: 14px 25px;

            font-size: 13px;

            letter-spacing: 2px;
        }


        .dropdown-menu a:hover {

            background: #091e16;
        }



        /* =========================
           HOME / HERO
        ========================= */

        .hero {

            position: relative;

            width: 100%;

            height: 100vh;

            min-height: 100vh;

            overflow: hidden;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            background: #000000;
        }



        /* =========================
           HERO IMAGE
        ========================= */

        .hero-bg {

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            display: block;

            object-fit: cover;

            object-position: center;

            z-index: 1;

            animation:
                heroEntrance 4.5s ease-out forwards;
        }



        /* =========================
           DARK OVERLAY
        ========================= */

        .hero-overlay {

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            background: rgba(0, 0, 0, 0.5);

            z-index: 2;

            pointer-events: none;
        }



        /* =========================
           HERO CONTENT
        ========================= */

        .hero-content {

            position: absolute;

            top: 50%;

            left: 50%;

            transform: translate(-50%, -50%);

            z-index: 3;

            width: 90%;

            max-width: 800px;

            text-align: center;

            pointer-events: none;
        }



        /* =========================
           TITLE
        ========================= */

        .hero h1 {

            font-size: 70px;

            font-weight: normal;

            line-height: 1.05;

            margin-bottom: 25px;

            color: #9dceff;

            text-shadow:
                2px 2px 10px rgba(0, 0, 0, 0.8);

            opacity: 0;

            transform: translateY(20px);

            animation:
                textAppear 1.4s ease-out 2.2s forwards;
        }



        /* =========================
           DESCRIPTION
        ========================= */

        .hero p {

            color: #9dceff;

            font-size: 18px;

            margin-bottom: 35px;

            text-shadow:
                1px 1px 6px rgba(0, 0, 0, 0.9);

            opacity: 0;

            transform: translateY(20px);

            animation:
                textAppear 1.2s ease-out 2.8s forwards;
        }



        /* =========================
           BUTTON
        ========================= */

        .hero .button {

            opacity: 0;

            transform: translateY(20px);

            animation:
                textAppear 1.2s ease-out 3.3s forwards;

            pointer-events: auto;
        }


        .button {

            display: inline-block;

            padding: 15px 32px;

            border: 1px solid #ffffff;

            text-decoration: none;

            color: #ffffff;

            letter-spacing: 2px;

            font-size: 12px;

            background: rgba(0, 0, 0, 0.3);

            transition:
                all 0.3s ease;
        }


        .button:hover {

            background: #ffffff;

            color: #000000;
        }



        /* =========================
           INTRO IMAGE ANIMATION
           
           KJO ËSHTË VETËM PËR HYRJEN
        ========================= */

        @keyframes heroEntrance {

            0% {

                transform: scale(1.05);

                transform-origin: center center;

                opacity: 0.4;
            }


            100% {

                transform: scale(1);

                transform-origin: center center;

                opacity: 1;
            }
        }



        /* =========================
           TEXT ANIMATION
        ========================= */

        @keyframes textAppear {

            0% {

                opacity: 0;

                transform: translateY(20px);
            }


            100% {

                opacity: 1;

                transform: translateY(0);
            }
        }



        /* =========================
           SLIDESHOW IMAGE ANIMATION
        ========================= */

        @keyframes slideshowAnimation {

            0% {

                transform: scale(1.05);

                opacity: 0.4;
            }


            100% {

                transform: scale(1);

                opacity: 1;
            }
        }



        /* =========================
           FOOTER
        ========================= */

        .studio-footer {

            width: 100%;

            height: 180px;

            background: #051711;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .studio-name {

            font-family:
                "Amsterdam Four_ttf",
                cursive;

            font-size: 55px;

            color: #ffffff;

            letter-spacing: 2px;
        }



        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 850px) {


            /* HEADER */

            header {

                height: 55px;

                justify-content: center;

                padding: 0 7%;
            }


            /* GREEN DIVIDER */

            .green-divider {

                height: 15px;

                top: 55px;
            }


            /* DESKTOP MENU */

            .desktop-menu {

                display: none;
            }


            /* MOBILE MENU */

            .menu-container {

                display: block;

                position: absolute;

                right: 20px;
            }


            /* MOBILE HERO */

            .hero {

                width: 100vw;

                height: 100vh;

                min-height: 100vh;

                overflow: hidden;
            }


            /* MOBILE IMAGE */

            .hero-bg {

                width: 100%;

                height: 100%;

                min-height: 100%;

                object-fit: cover;

                object-position: center center;
            }


            /* MOBILE TITLE */

            .hero h1 {

                font-size: 44px;

                line-height: 1.05;
            }


            /* MOBILE PARAGRAPH */

            .hero p {

                font-size: 16px;

                margin-bottom: 30px;
            }


            /* MOBILE LOGO */

            .studio-logo {

                width: 110px;

                top: 10px;

                left: 7%;

                z-index: 1001;
            }


            /* MOBILE FOOTER */

            .studio-footer {

                height: 100px;
            }


            .studio-name {

                font-size: 34px;
            }

        }



        /* ==================================================
           VERY SMALL PHONES
        ================================================== */

        @media (max-width: 400px) {

            .hero h1 {

                font-size: 38px;
            }


            .hero p {

                font-size: 14px;
            }


            .hero .button {

                padding: 13px 25px;
            }


            .studio-logo {

                width: 100px;
            }

        }

    </style>

</head>



<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <header>


        <img
            src="images/logo.png"
            alt="My Art Studio Logo"
            class="studio-logo"
        >


        <nav class="desktop-menu">

            <a href="#home">HOME</a>

            <a href="about.html">ABOUT</a>

            <a href="paintings.html">PAINTINGS</a>

            <a href="#contact">CONTACT</a>

        </nav>



        <div class="menu-container">


            <button
                class="menu-button"
                id="menuButton"
                aria-label="Open menu"
            >
                ☰
            </button>


            <nav
                class="dropdown-menu"
                id="dropdownMenu"
            >

                <a href="#home">HOME</a>

                <a href="about.html">ABOUT</a>

                <a href="paintings.html">PAINTINGS</a>

                <a href="#contact">CONTACT</a>

            </nav>


        </div>


    </header>



    <!-- GREEN LINE -->

    <div class="green-divider"></div>



    <!-- =========================================
         HOME
    ========================================== -->

    <section
        class="hero"
        id="home"
    >


        <!--
            FOTOJA KRYESORE E HYRJES
        -->

        <img
            src="images/(1).png"
            class="hero-bg"
            id="heroImage"
            alt="Artwork"
        >


        <!-- DARK OVERLAY -->

        <div class="hero-overlay"></div>



        <!-- =====================================
             TEXT
        ====================================== -->

        <div class="hero-content">


            <h1>

                Art That Speaks<br>

                Without Words

            </h1>


            <p>

                Original paintings created with passion,
                emotion and imagination.

            </p>


            <a
                href="paintings.html"
                class="button"
            >

                EXPLORE PAINTINGS

            </a>


        </div>


    </section>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="studio-footer">

        <div class="studio-name">

            Ciela Art

        </div>

    </footer>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>


        /* ========================================
           MOBILE MENU
        ======================================== */

        const menuButton =
            document.getElementById('menuButton');


        const dropdownMenu =
            document.getElementById('dropdownMenu');


        menuButton.addEventListener(
            'click',
            function() {

                dropdownMenu.classList.toggle('open');

            }
        );



        /* ========================================
           HOME ELEMENTS
        ======================================== */

        const heroImage =
            document.getElementById('heroImage');


        const homeLinks =
            document.querySelectorAll(
                'a[href="#home"]'
            );



        /* ========================================
           SLIDESHOW
           
           HYRJA NUK PREKET.
           
           PAS 4.5 SEKONDASH:
           
           (1).png
              ↓
           kornix.jpeg
              ↓
           (1).png
              ↓
           kornix.jpeg
              ↓
           ...
           
           SHKRIMI NUK RIFILLOHET.
        ======================================== */

        const slideshowImages = [

            'images/kornix.jpeg',

            'images/(1).png'

        ];


        let currentSlide = 0;


        let slideshowStarted = false;


        /*

           Hyrja fillestare zgjat 4.5 sekonda.

           Pastaj fillon slideshow.

        */

        setTimeout(
            function() {


                if (slideshowStarted) {

                    return;

                }


                slideshowStarted = true;


                setInterval(
                    function() {


                        /*

                           Heqim përkohësisht
                           animacionin.

                        */

                        heroImage.style.animation =
                            'none';


                        /*

                           Rifreskojmë elementin
                           që animacioni të
                           mund të fillojë
                           përsëri.

                        */

                        void heroImage.offsetWidth;


                        /*

                           Ndryshojmë foton.

                        */

                        heroImage.src =
                            slideshowImages[currentSlide];


                        /*

                           Vetëm slideshow-i
                           merr këtë animacion.

                           SHKRIMI NUK PREKET.

                        */

                        heroImage.style.animation =
                            'slideshowAnimation 2s ease-out forwards';


                        /*

                           Kalojmë te fotoja tjetër.

                        */

                        currentSlide++;


                        if (
                            currentSlide >=
                            slideshowImages.length
                        ) {

                            currentSlide = 0;

                        }


                    },

                    6000

                );


            },

            4500

        );



        /* ========================================
           HOME BUTTON / HOME MENU
        ======================================== */

        homeLinks.forEach(
            function(link) {


                link.addEventListener(
                    'click',
                    function() {


                        dropdownMenu.classList.remove(
                            'open'
                        );


                        /*

                           Kur kthehemi te HOME,

                           rivendosim vetëm
                           animacionin e hyrjes.

                        */

                        heroImage.style.animation =
                            'none';


                        void heroImage.offsetWidth;


                        heroImage.style.animation =
                            'heroEntrance 4.5s ease-out forwards';



                    }
                );

            }
        );


    </script>


</body>

</html>
